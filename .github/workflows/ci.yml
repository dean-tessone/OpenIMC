name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    env:
      OPENIMC_DISABLE_GPU: "1"
      OPENIMC_DISABLE_LLM: "1"
      OPENIMC_DISABLE_ILASTIK: "1"
      CUDA_VISIBLE_DEVICES: ""
      TORCH_USE_CUDA_DSA: "0"
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-14, windows-2022]
        python-version: ["3.11"]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Configure headless Qt on Linux
        if: runner.os == 'Linux'
        run: |
          echo "QT_QPA_PLATFORM=offscreen" >> "$GITHUB_ENV"
          echo "QT_QUICK_BACKEND=software" >> "$GITHUB_ENV"
      - name: Normalize Qt scaling on macOS
        if: runner.os == 'macOS'
        run: |
          echo "QT_AUTO_SCREEN_SCALE_FACTOR=0" >> "$GITHUB_ENV"
          echo "QT_SCALE_FACTOR=1" >> "$GITHUB_ENV"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest
      - name: Run fast tests
        if: runner.os != 'macOS'
        run: |
          pytest -m "not slow"
      - name: Run fast tests without Qt UI
        if: runner.os == 'macOS'
        run: |
          pytest -m "not slow and not ui"
      - name: Run integration tests
        if: runner.os != 'macOS'
        run: |
          pytest -m "integration"
      - name: Run integration tests without Qt UI
        if: runner.os == 'macOS'
        run: |
          pytest -m "integration and not ui"
      - name: Run regression tests
        if: runner.os != 'macOS'
        run: |
          pytest -m "regression"
      - name: Run regression tests without Qt UI
        if: runner.os == 'macOS'
        run: |
          pytest -m "regression and not ui"
